<script>
const token = localStorage.getItem('neopxl_token');
if (!token) { window.location.href = '/login'; }
const apiFetch = async (url, opts = {}) => {
  const r = await fetch(url, { ...opts, headers: { ...opts.headers, 'Authorization': 'Bearer ' + token } });
  if (r.status === 401) { localStorage.removeItem('neopxl_token'); window.location.href = '/login'; }
  return r;
};
function logout() { localStorage.removeItem('neopxl_token'); localStorage.removeItem('neopxl_user'); window.location.href = '/login'; }
function fmtDuration(ms) {
  if (!ms) return '—';
  const s = ms / 1000;
  if (s < 59.95) return s.toFixed(1) + 's';
  const m = s / 60;
  if (m < 59.95) {
    const mm = Math.floor(m), ss = Math.round((m - mm) * 60);
    return (ss >= 60 ? mm + 1 : mm) + 'm' + (ss % 60 > 0 ? ' ' + ss % 60 + 's' : '');
  }
  const h = Math.floor(m / 60), rm = Math.round(m % 60);
  return (rm >= 60 ? h + 1 : h) + 'h' + (rm % 60 > 0 ? ' ' + rm % 60 + 'm' : '');
}
let _copyText = '';
function showModal(title, content, copyText) {
  document.getElementById('modalOverlay').style.display='flex';
  _copyText = copyText || '';
  const copyBtn = copyText ? '<button class="btn-copy" onclick="copyToClipboard()" title="Copy"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" style="width:18px;height:18px;stroke:var(--ink)">' +
    '<path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184"/></svg></button>' : '';
  document.getElementById('modalContent').innerHTML='<button class="modal-close" onclick="closeModal()">×</button>'+copyBtn+'<h3>'+title+'</h3>'+content;
}
function copyToClipboard() {
  navigator.clipboard.writeText(_copyText).then(() => {
    const btn = document.querySelector('#modalContent .btn-secondary');
    if (btn) { btn.textContent = '✓ Copied!'; setTimeout(() => { btn.textContent = '📋 Copy'; }, 1500); }
  });
}
function closeModal() { document.getElementById('modalOverlay').style.display='none'; }
function initChipInput(containerId, initialWords) {
  const box = document.getElementById(containerId);
  if (!box) return null;
  box.classList.add('chip-box');
  const words = [];
  const render = () => {
    box.querySelectorAll('.chip').forEach(c => c.remove());
    words.forEach(w => {
      const c = document.createElement('span');
      c.className = 'chip';
      c.textContent = w;
      const x = document.createElement('button');
      x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', 'remove');
      x.onclick = () => { words.splice(words.indexOf(w), 1); render(); box.querySelector('input').focus(); };
      c.appendChild(x);
      box.insertBefore(c, input);
    });
  };
  const input = document.createElement('input');
  input.className = 'chip-input';
  input.placeholder = box.dataset.placeholder || 'Type a word and press Enter';
  const add = () => { const v = input.value.trim(); if (v) { words.push(v); input.value = ''; render(); } };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',' || e.key === 'Tab') { add(); if (e.key !== 'Tab') e.preventDefault(); }
    else if (e.key === 'Backspace' && input.value === '') { words.pop(); render(); }
  });
  input.addEventListener('blur', add);
  box.appendChild(input);
  box.addEventListener('click', () => input.focus());
  (initialWords || []).forEach(w => { const v = String(w).trim(); if (v) words.push(v); });
  render();
  return {
    get: () => words.slice(),
    set: arr => { words.length = 0; (arr || []).forEach(w => { const v = String(w).trim(); if (v) words.push(v); }); render(); }
  };
}
function filterToChips(filterStr) {
  let keep = [], drop = [];
  const pushWords = (target, v) => {
    if (typeof v !== 'string') return;
    for (const w of v.split('|')) { const s = w.trim(); if (s) target.push(s); }
  };
  if (filterStr) {
    try {
      let parsed = JSON.parse(filterStr);
      while (typeof parsed === 'string') { try { parsed = JSON.parse(parsed); } catch { break; } }
      if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
        if (Array.isArray(parsed.keepIf)) keep = parsed.keepIf.filter(x => typeof x === 'string');
        if (Array.isArray(parsed.dropIf)) drop = parsed.dropIf.filter(x => typeof x === 'string');
        if (!keep.length && parsed.keepIf && typeof parsed.keepIf === 'object' && !Array.isArray(parsed.keepIf)) {
          for (const arr of Object.values(parsed.keepIf)) if (arr && typeof arr === 'object') for (const v of Object.values(arr)) pushWords(keep, v);
        }
        if (!drop.length && parsed.dropIf && typeof parsed.dropIf === 'object' && !Array.isArray(parsed.dropIf)) {
          for (const arr of Object.values(parsed.dropIf)) if (arr && typeof arr === 'object') for (const v of Object.values(arr)) pushWords(drop, v);
        }
      }
    } catch {}
  }
  return { keep, drop };
}
function chipsToFilter(keepArr, dropArr) {
  const cfg = {};
  if (keepArr && keepArr.length) cfg.keepIf = keepArr;
  if (dropArr && dropArr.length) cfg.dropIf = dropArr;
  return (cfg.keepIf || cfg.dropIf) ? JSON.stringify(cfg) : '';
}

  }

})();
document.addEventListener('DOMContentLoaded', function () { applyTheme(currentTheme(), false); });
function currentTheme() {
  return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
}
function applyTheme(theme, persist) {
  const dark = theme === 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  if (persist) { try { localStorage.setItem('neopxl_theme', theme); } catch(e) {} }
  const icon = document.getElementById('themeIcon');
  if (icon) {
    icon.innerHTML = dark

  }
  try { window.dispatchEvent(new CustomEvent('themechange')); } catch(e) {}
}
