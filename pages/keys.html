<div class="topbar"><h1>API Keys</h1><button class="btn btn-primary" onclick="openCreateKeyModal()"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:16px;height:16px"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg> New API Key</button></div>

<div id="keysList" style="display:flex;flex-direction:column;gap:var(--spacing-sm)"></div>

<style>
</style>

<div class="modal-overlay" id="keyModalOverlay"><div class="modal" style="max-width:500px">
  <button class="modal-close" onclick="closeKeyModal()">×</button>
  <h3>Create API Key</h3>
  <form onsubmit="event.preventDefault();createKey()" style="margin-top:var(--spacing-md)">
    <div class="form-group"><label>Key Name</label><input type="text" id="keyName" placeholder="e.g. Postman, Production" required></div>
    <button type="submit" class="btn btn-primary">Generate Key</button>
  </form>
  <div id="newKeyDisplay" style="display:none;margin-top:var(--spacing-lg);padding:var(--spacing-md);background:var(--surface-feature);border-radius:var(--rounded-md);border:1px solid var(--brand-green)">
    <p style="font-size:13px;font-weight:600;color:var(--brand-green-dark);margin-bottom:6px">Your new API key — copy it now, you won't see it again:</p>
    <div style="font-family:monospace;font-size:14px;word-break:break-all;background:var(--canvas);padding:var(--spacing-sm);border-radius:var(--rounded-sm)" id="newKeyValue"></div>
  </div>
</div></div>

<script>
const currentUser = JSON.parse(localStorage.getItem('neopxl_user') || '{}');

async function loadKeys() {
  const keys = await apiFetch('/api/keys').then(d=>d.json()).catch(()=>[]);
  const list = document.getElementById('keysList');
  if (!keys.length) { list.innerHTML = '<div style="text-align:center;padding:var(--spacing-xxl);color:var(--steel)">No API keys yet. Create one above.</div>'; return; }
  list.innerHTML = keys.map(k => `
    <div class="task-card" style="padding:var(--spacing-md) var(--spacing-lg)">
      <div style="flex:1;min-width:0">
        <strong>${k.name}</strong>
        <div style="font-family:monospace;font-size:12px;color:var(--steel);margin-top:4px">${k.key.slice(0,8)}...${k.key.slice(-4)}</div>
        <div style="font-size:11px;color:var(--stone);margin-top:2px">Created ${k.created_at?new Date(Number(k.created_at)).toLocaleDateString():'—'}${k.last_used?' · Last used '+new Date(Number(k.last_used)).toLocaleDateString():''}</div>
      </div>
      <button class="btn btn-danger btn-sm" onclick="revokeKey('${k.id}')">Revoke</button>
    </div>`).join('');
}

function openCreateKeyModal() { document.getElementById('keyName').value=''; document.getElementById('newKeyDisplay').style.display='none'; document.getElementById('keyModalOverlay').style.display='flex'; }
function closeKeyModal() { document.getElementById('keyModalOverlay').style.display='none'; }
document.getElementById('keyModalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeKeyModal()});

async function createKey() {
  const name = document.getElementById('keyName').value.trim();
  if (!name) return;
  const r = await apiFetch('/api/keys', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name}) });
  const k = await r.json();
  document.getElementById('newKeyValue').textContent = k.key;
  document.getElementById('newKeyDisplay').style.display = 'block';
  loadKeys();
}

async function revokeKey(id) {
  if (!confirm('Revoke this API key? It will stop working immediately.')) return;
  await apiFetch('/api/keys/'+id, { method:'DELETE' });
  loadKeys();
}

loadKeys();
</script>
