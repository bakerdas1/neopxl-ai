<div class="topbar">
  <h1>Workflows</h1>
  <button class="btn btn-primary" id="newWfBtn" onclick="openWfModal()">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:16px;height:16px"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
    New Workflow
  </button>
</div>
<div class="settings-card">
  <div style="display:flex;align-items:center;gap:var(--spacing-sm);margin-bottom:var(--spacing-md)">
    <label style="font-size:13px;font-weight:600;margin:0">Template</label>
    <select id="wfTemplateFilter" onchange="loadWorkflows()" style="padding:7px 12px;border:1px solid var(--hairline-strong);border-radius:var(--rounded-md);font-family:var(--font-family);font-size:13px;color:var(--ink);background:var(--canvas)">
      <option value="">All templates</option>
    </select>
  </div>
  <div id="workflowsList"></div>
</div>

<!-- Workflow drawer modal -->
<div class="drawer-overlay" id="wfModalOverlay"><div class="drawer">
  <button class="modal-close" onclick="closeWfModal()">×</button>
  <h3 id="wfModalTitle">New Workflow</h3>
  <form id="wfForm" onsubmit="event.preventDefault();saveWorkflow()" style="margin-top:var(--spacing-md)">
    <input type="hidden" id="wfEditId">
    <div class="form-group"><label>Workflow Name</label><input type="text" id="wfName" placeholder="e.g. Total Calculator" required></div>
    <div class="form-group"><label>Description</label><input type="text" id="wfDesc" placeholder="Optional description"></div>
    <div class="form-group"><label>Language</label><select id="wfLanguage" onchange="onWfLanguageChange()">
      <option value="python">Python</option>
      <option value="javascript">JavaScript</option>
    </select></div>
    <div class="form-group"><label>Enabled</label><label style="display:inline-flex;align-items:center;gap:6px;margin-left:8px"><input type="checkbox" id="wfEnabled" style="width:auto;margin:0"> Enabled</label></div>
    <div class="form-group"><label>Code</label><textarea id="wfCode" rows="10" placeholder="def run(data):\n    return {'total': data.get('amount', 0)}" required></textarea></div>
    <div style="font-size:11px;color:var(--steel);margin-top:6px;margin-bottom:var(--spacing-sm)">
      The script must define a top-level <code>run(data)</code> function (Python) or <code>function run(data)</code> (JavaScript) that returns a JSON-serializable value.
    </div>
    <div style="display:flex;gap:var(--spacing-sm);justify-content:flex-end">
      <button type="button" class="btn btn-secondary" onclick="closeWfModal()">Cancel</button>
      <button type="submit" class="btn btn-primary" id="wfSaveBtn">Save Workflow</button>
    </div>
  </form>
</div></div>

<!-- Dry-run test drawer -->
<div class="drawer-overlay" id="wfTestOverlay"><div class="drawer">
  <button class="modal-close" onclick="closeWfTest()">×</button>
  <h3 id="wfTestTitle">Test Workflow</h3>
  <form id="wfTestForm" onsubmit="event.preventDefault();runWfTest()" style="margin-top:var(--spacing-md)">
    <input type="hidden" id="wfTestId">
    <div class="form-group"><label>Sample Input JSON</label><textarea id="wfTestInput" rows="6" placeholder='{"amount": 100, "currency": "USD"}' required></textarea></div>
    <div style="display:flex;gap:var(--spacing-sm);justify-content:flex-end;margin-top:var(--spacing-md)">
      <button type="button" class="btn btn-secondary" onclick="closeWfTest()">Cancel</button>
      <button type="submit" class="btn btn-primary">Run Test</button>
    </div>
  </form>
  <div id="wfTestResult" style="margin-top:var(--spacing-md);display:none"></div>
</div></div>

<script>
const currentUser = JSON.parse(localStorage.getItem('neopxl_user') || '{}');

let workflowsCache = [];
let templatesCache = [];
let currentWfId = null;
let currentTemplateFilter = '';

async function loadTemplatesForFilter() {
  try {
    templatesCache = await apiFetch('/api/templates').then(d => d.json()).catch(() => []);
    const sel = document.getElementById('wfTemplateFilter');
    sel.innerHTML = '<option value="">All templates</option>' + templatesCache.map(t =>
      '<option value="' + esc(t.id) + '">' + esc(t.name) + '</option>'
    ).join('');
  } catch (e) {}
}

async function loadWorkflows() {
  const templateId = document.getElementById('wfTemplateFilter').value;
  currentTemplateFilter = templateId;
  try {
    if (!templateId) {
      // Load all workflows - we need to fetch per template
      workflowsCache = [];
      const tpls = templatesCache.length ? templatesCache : (await apiFetch('/api/templates').then(d => d.json()).catch(() => []));
      for (const t of tpls) {
        const wfs = await apiFetch('/api/workflows?template_id=' + esc(t.id)).then(d => d.json()).catch(() => []);
        wfs.forEach(w => w._templateName = t.name);
        workflowsCache.push(...wfs);
      }
    } else {
      workflowsCache = await apiFetch('/api/workflows?template_id=' + esc(templateId)).then(d => d.json()).catch(() => []);
      const t = templatesCache.find(x => x.id === templateId);
      workflowsCache.forEach(w => w._templateName = t ? t.name : '');
    }
    renderWorkflows();
  } catch (e) {
    document.getElementById('workflowsList').innerHTML = '<div style="color:#DB3030;padding:var(--spacing-md)">Error loading workflows</div>';
  }
}

function renderWorkflows() {
  const box = document.getElementById('workflowsList');
  const p = window.PERMS || {};
  const isAdmin = currentUser.role === 1;

  if (!workflowsCache.length) {
    box.innerHTML = '<div style="text-align:center;padding:var(--spacing-xxl);color:var(--steel)">No workflows yet</div>';
    return;
  }

  box.innerHTML = workflowsCache.map(w => {
    const canEdit = isAdmin || p['workflows.edit'];
    const canDelete = isAdmin || p['workflows.delete'];
    const canExecute = isAdmin || p['workflows.execute'];
    return `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--spacing-sm) var(--spacing-md);border-bottom:1px solid var(--hairline-soft);gap:var(--spacing-md)">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:var(--spacing-sm)"><strong>${esc(w.name)}</strong>${w.isEnabled ? '' : ' <span style="font-size:10px;background:var(--hairline-strong);color:var(--steel);padding:2px 8px;border-radius:999px">Disabled</span>'}</div>
        <div style="font-size:11px;color:var(--steel)">${w.language} · v${w.version} · ${esc(w._templateName || '—')}${w.description ? ' · ' + esc(w.description) : ''}</div>
      </div>
      <div style="display:flex;gap:6px">
        ${canExecute ? '<button class="btn btn-secondary btn-sm" onclick="testWf(\'' + esc(w.id) + '\')">Test</button>' : ''}
        ${canEdit ? '<button class="btn btn-secondary btn-sm" onclick="editWf(\'' + esc(w.id) + '\')">Edit</button>' : ''}
        ${canEdit ? '<button class="btn btn-secondary btn-sm" onclick="cloneWf(\'' + esc(w.id) + '\')">Clone</button>' : ''}
        ${canDelete ? '<button class="btn btn-danger btn-sm" onclick="deleteWf(\'' + esc(w.id) + '\')">Delete</button>' : ''}
      </div>
    </div>`;
  }).join('');
}

async function openWfModal() {
  document.getElementById('wfEditId').value = '';
  document.getElementById('wfName').value = '';
  document.getElementById('wfDesc').value = '';
  document.getElementById('wfLanguage').value = 'python';
  document.getElementById('wfEnabled').checked = true;
  document.getElementById('wfCode').value = 'def run(data):\n    return data';
  document.getElementById('wfModalTitle').textContent = 'New Workflow';
  document.getElementById('wfSaveBtn').textContent = 'Save Workflow';
  document.getElementById('wfModalOverlay').classList.add('open');
}

function closeWfModal() {
  document.getElementById('wfModalOverlay').classList.remove('open');
}

function onWfLanguageChange() {
  const ta = document.getElementById('wfCode');
  const lang = document.getElementById('wfLanguage').value;
  if (!ta.value || ta.value === 'def run(data):\n    return data') {
    ta.value = lang === 'python'
      ? 'def run(data):\n    return data'
      : 'function run(data) {\n    return data;\n}';
  }
}

async function editWf(id) {
  const wf = await apiFetch('/api/workflows/' + esc(id)).then(d => d.json()).catch(() => null);
  if (!wf) return;
  document.getElementById('wfEditId').value = wf.id;
  document.getElementById('wfName').value = wf.name;
  document.getElementById('wfDesc').value = wf.description || '';
  document.getElementById('wfLanguage').value = wf.language;
  document.getElementById('wfEnabled').checked = wf.isEnabled;
  document.getElementById('wfCode').value = wf.code;
  document.getElementById('wfModalTitle').textContent = 'Edit Workflow';
  document.getElementById('wfSaveBtn').textContent = 'Update Workflow';
  document.getElementById('wfModalOverlay').classList.add('open');
}

async function cloneWf(id) {
  const wf = await apiFetch('/api/workflows/' + esc(id)).then(d => d.json()).catch(() => null);
  if (!wf) return;
  document.getElementById('wfEditId').value = '';
  document.getElementById('wfName').value = (wf.name || '') + ' - Cloned';
  document.getElementById('wfDesc').value = wf.description || '';
  document.getElementById('wfLanguage').value = wf.language;
  document.getElementById('wfEnabled').checked = false;
  document.getElementById('wfCode').value = wf.code;
  document.getElementById('wfModalTitle').textContent = 'Clone Workflow';
  document.getElementById('wfSaveBtn').textContent = 'Save Workflow';
  document.getElementById('wfModalOverlay').classList.add('open');
}

async function deleteWf(id) {
  if (!confirm('Delete this workflow?')) return;
  await apiFetch('/api/workflows/' + esc(id), { method: 'DELETE' });
  loadWorkflows();
}

async function saveWorkflow() {
  const id = document.getElementById('wfEditId').value;
  const name = document.getElementById('wfName').value.trim();
  const desc = document.getElementById('wfDesc').value.trim();
  const language = document.getElementById('wfLanguage').value;
  const code = document.getElementById('wfCode').value;
  const isEnabled = document.getElementById('wfEnabled').checked;

  if (!name) return alert('Name required');

  const templateId = currentTemplateFilter || (workflowsCache.find(w => w.id === id) || {})._templateId || '';
  if (!templateId) {
    // Ask which template to attach to
    const tpls = templatesCache.length ? templatesCache : await apiFetch('/api/templates').then(d => d.json()).catch(() => []);
    if (!tpls.length) return alert('No templates available');
    const names = tpls.map(t => t.name + ' (' + t.id + ')').join('\n');
    const choice = prompt('Select template to attach workflow to:\n' + names);
    if (!choice) return;
    const match = tpls.find(t => t.name + ' (' + t.id + ')' === choice);
    if (!match) return alert('Invalid template');
    templateId = match.id;
  }

  try {
    const body = JSON.stringify({ template_id: templateId, name, description: desc, language, code, is_enabled: isEnabled });
    if (id) {
      await apiFetch('/api/workflows/' + esc(id), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body });
    } else {
      await apiFetch('/api/workflows', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
    }
    closeWfModal();
    loadWorkflows();
  } catch (e) {
    alert(e.message || 'Save failed');
  }
}

async function testWf(id) {
  const wf = await apiFetch('/api/workflows/' + esc(id)).then(d => d.json()).catch(() => null);
  if (!wf) return;
  document.getElementById('wfTestId').value = wf.id;
  document.getElementById('wfTestTitle').textContent = 'Test: ' + wf.name;
  document.getElementById('wfTestInput').value = JSON.stringify({ amount: 100, currency: 'USD' }, null, 2);
  document.getElementById('wfTestResult').style.display = 'none';
  document.getElementById('wfTestOverlay').classList.add('open');
}

function closeWfTest() {
  document.getElementById('wfTestOverlay').classList.remove('open');
}

async function runWfTest() {
  const id = document.getElementById('wfTestId').value;
  const input = document.getElementById('wfTestInput').value;
  let sample;
  try { sample = JSON.parse(input); } catch { return alert('Invalid JSON'); }

  const btn = document.querySelector('#wfTestForm button[type="submit"]');
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Running…';

  try {
    const r = await apiFetch('/api/workflows/' + esc(id) + '/dry-run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sample }),
    });
    const d = await r.json();
    const res = document.getElementById('wfTestResult');
    res.style.display = 'block';
    if (d.ok) {
      res.innerHTML = '<div style="background:var(--surface-feature);color:var(--brand-green-dark);padding:var(--spacing-md);border-radius:var(--rounded-md);font-size:12px"><strong>Success</strong><br>' + esc(JSON.stringify(d.result, null, 2)) + '<br><small>Duration: ' + d.duration_ms + 'ms</small></div>';
    } else {
      res.innerHTML = '<div style="background:rgba(219,48,48,.1);color:#DB3030;padding:var(--spacing-md);border-radius:var(--rounded-md);font-size:12px"><strong>Error</strong><br>' + esc((d.error && d.error.message) || 'Unknown error') + '<br><small>Duration: ' + d.duration_ms + 'ms</small></div>';
    }
  } catch (e) {
    alert(e.message || 'Test failed');
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
  }
}

document.getElementById('wfModalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeWfModal(); });
document.getElementById('wfTestOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeWfTest(); });

loadTemplatesForFilter();
loadWorkflows();
</script>
