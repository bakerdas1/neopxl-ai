<div class="topbar">
  <h1>Templates</h1>
  <button class="btn btn-primary" id="newTplBtn" onclick="openTplModal()">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:16px;height:16px"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
    New Template
  </button>
</div>
<div class="settings-card">
  <div id="templatesList"></div>
</div>

<div class="drawer-overlay" id="tplModalOverlay"><div class="drawer">
  <button class="modal-close" onclick="closeTplModal()">×</button>
  <h3 id="tplModalTitle">New Template</h3>
  <form id="tplForm" onsubmit="event.preventDefault();saveTemplateHandler()" style="margin-top:var(--spacing-md)">
    <input type="hidden" id="tplEditId">
    <div class="form-group"><label>Template Name</label><input type="text" id="newTplName" placeholder="e.g. Landing Invoices" required></div>
      <div class="form-group"><label>Schema (JSON)</label><textarea id="newTplSchema" rows="6" placeholder='[{"name":"field","type":"string","description":"..."}]'></textarea></div>
      <div class="form-group"><label>Keep if (rows must contain one of these words)</label><div class="chip-box" id="keepIfChips" data-placeholder="Type a word and press Enter"></div></div>
      <div class="form-group"><label>Drop if (rows containing any of these words are removed)</label><div class="chip-box" id="dropIfChips" data-placeholder="Type a word and press Enter"></div></div>
      <div class="form-group"><label>Auto-Detect Keywords</label><input type="text" id="newTplKeywords" placeholder="e.g. landing, parking, take off, tons, aircraft registration"></div>
      <div class="form-group"><label>Domain</label><input type="text" id="newTplDomain" placeholder="e.g. aviation, medical, generic" list="domainOptions"><datalist id="domainOptions"></datalist></div>
      <div class="form-group">
        <label>Date Format <span style="font-weight:400;color:var(--steel)">(applied to all date values in the schema)</span></label>
        <select id="newTplDateFormat" onchange="onTplDateFormatChange()">
          <option value="">Default (keep document format)</option>
          <option value="YYYY-MM-DD">YYYY-MM-DD (2026-08-08)</option>
          <option value="DD/MM/YYYY">DD/MM/YYYY (08/08/2026)</option>
          <option value="MM/DD/YYYY">MM/DD/YYYY (08/08/2026)</option>
          <option value="DD-MM-YYYY">DD-MM-YYYY (08-08-2026)</option>
          <option value="MM-DD-YYYY">MM-DD-YYYY (08-08-2026)</option>
          <option value="DD.MM.YYYY">DD.MM.YYYY (08.08.2026)</option>
          <option value="YYYY/MM/DD">YYYY/MM/DD (2026/08/08)</option>
          <option value="DD Mon YYYY">DD Mon YYYY (08 Aug 2026)</option>
          <option value="Mon DD, YYYY">Mon DD, YYYY (Aug 8, 2026)</option>
          <option value="DD MMMM YYYY">DD MMMM YYYY (08 August 2026)</option>
          <option value="MMMM DD, YYYY">MMMM DD, YYYY (August 8, 2026)</option>
          <option value="DD-MM-YY">DD-MM-YY (08-08-26)</option>
          <option value="MM/DD/YY">MM/DD/YY (08/08/26)</option>
          <option value="__other__">Other (custom)...</option>
        </select>
        <input type="text" id="newTplDateFormatCustom" placeholder="e.g. DD MMM YYYY" style="display:none;margin-top:6px">
        <div style="font-size:11px;color:var(--steel);margin-top:6px">Note: this format will be applied to every date value in the schema (invoice dates, due dates, flight dates, etc.).</div>
      </div>
      <div class="form-group"><label><input type="checkbox" id="newTplVerify" style="width:auto;display:inline-block;margin-right:6px"> Verify coverage (check record counts, catch missed rows)</label></div>
      <div class="form-group"><label><input type="checkbox" id="newTplDropSummary" style="width:auto;display:inline-block;margin-right:6px"> Drop unidentified summary rows (invoice totals printed as line items)</label></div>
    <button type="submit" class="btn btn-primary" id="tplSaveBtn">Save Template</button>
  </form>
</div></div>

<script>
const currentUser = JSON.parse(localStorage.getItem('neopxl_user') || '{}');

// Templates
async function loadTemplateList(){const ts=await apiFetch('/api/templates').then(d=>d.json()).catch(()=>[]);const p=window.PERMS||{};document.getElementById('templatesList').innerHTML=ts.map(t=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:var(--spacing-sm) var(--spacing-md);border-bottom:1px solid var(--hairline-soft);gap:var(--spacing-md)"><div style="flex:1;min-width:0"><strong>${esc(t.name)}</strong><div style="font-size:11px;color:var(--steel)">${esc(t.id)} · ${t.schema?'Has schema':'No schema'}${t.filter?' + filter':''}${t.dateFormat?' + dates: '+esc(t.dateFormat):''}${t.keywords?' · \''+esc(t.keywords.split(',')[0])+'...\'':''}</div></div>${p['templates.edit']?`<button class="btn btn-secondary btn-sm" onclick="editTpl('${esc(t.id)}')">Edit</button>`:''}${p['templates.delete']?`<button class="btn btn-danger btn-sm" onclick="deleteTpl('${esc(t.id)}')">Delete</button>`:''}</div>`).join('')}
function onTplDateFormatChange(){const c=document.getElementById('newTplDateFormatCustom');c.style.display=document.getElementById('newTplDateFormat').value==='__other__'?'block':'none'}
function getTplDateFormat(){const sel=document.getElementById('newTplDateFormat');const val=sel.value;if(val==='__other__')return document.getElementById('newTplDateFormatCustom').value.trim()||'';return val}
function setTplDateFormat(fmt){const sel=document.getElementById('newTplDateFormat');const custom=document.getElementById('newTplDateFormatCustom');const known=[...sel.options].some(o=>o.value===fmt);if(fmt&&!known){sel.value='__other__';custom.value=fmt;custom.style.display='block'}else{sel.value=fmt||'';custom.value='';custom.style.display='none'}}
function openTplModal(){document.getElementById('tplEditId').value='';document.getElementById('newTplName').value='';document.getElementById('newTplSchema').value='';keepChips.set([]);dropChips.set([]);document.getElementById('newTplKeywords').value='';document.getElementById('newTplDomain').value='';setTplDateFormat('');document.getElementById('newTplVerify').checked=false;document.getElementById('newTplDropSummary').checked=false;document.getElementById('tplSaveBtn').textContent='Save Template';document.getElementById('tplModalTitle').textContent='New Template';document.getElementById('tplModalOverlay').classList.add('open')}
function closeTplModal(){document.getElementById('tplModalOverlay').classList.remove('open')}
async function editTpl(id){const ts=await apiFetch('/api/templates').then(d=>d.json()).catch(()=>[]);const t=ts.find(x=>x.id===id);if(!t)return;document.getElementById('tplEditId').value=t.id;document.getElementById('newTplName').value=t.name;document.getElementById('newTplSchema').value=t.schema||'';const fc=filterToChips(t.filter);keepChips.set(fc.keep);dropChips.set(fc.drop);document.getElementById('newTplKeywords').value=t.keywords||'';document.getElementById('newTplDomain').value=t.domain||'';setTplDateFormat(t.dateFormat||'');document.getElementById('newTplVerify').checked=!!t.verifyCoverage;document.getElementById('newTplDropSummary').checked=!!t.dropSummaryRows;document.getElementById('tplSaveBtn').textContent='Update Template';document.getElementById('tplModalTitle').textContent='Edit Template';document.getElementById('tplModalOverlay').classList.add('open')}
async function saveTemplateHandler(){const id=document.getElementById('tplEditId').value;const n=document.getElementById('newTplName').value.trim();const s=document.getElementById('newTplSchema').value.trim();const f=chipsToFilter(keepChips.get(),dropChips.get());const kw=document.getElementById('newTplKeywords').value.trim();const dm=document.getElementById('newTplDomain').value.trim();const df=getTplDateFormat();const vc=document.getElementById('newTplVerify').checked;const dsr=document.getElementById('newTplDropSummary').checked;if(!n)return alert('Name required');const body=JSON.stringify({name:n,schema:s,filter:f,keywords:kw,domain:dm,dateFormat:df,verifyCoverage:vc,dropSummaryRows:dsr});if(id)await apiFetch('/api/templates/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body});else await apiFetch('/api/templates',{method:'POST',headers:{'Content-Type':'application/json'},body});closeTplModal();loadTemplateList()}
async function deleteTpl(id){if(!confirm('Delete?'))return;await apiFetch('/api/templates/'+id,{method:'DELETE'});loadTemplateList()}

document.getElementById('tplModalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeTplModal()});

loadTemplateList();
const keepChips = initChipInput('keepIfChips', []);
const dropChips = initChipInput('dropIfChips', []);

// Gate the create button and re-render row actions once permissions load.
function applyTplPerms(){const p=window.PERMS||{};const b=document.getElementById('newTplBtn');if(b&&!p['templates.create'])b.style.display='none';loadTemplateList();}
if(window.PERMS&&Object.keys(window.PERMS).length)applyTplPerms();else window.addEventListener('permsready',applyTplPerms);
</script>
