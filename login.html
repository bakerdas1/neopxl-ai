<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neopxl AI — Login</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script>try{if(localStorage.getItem('neopxl_theme')==='dark'||(!localStorage.getItem('neopxl_theme')&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<style>
:root {
  --brand-green: #00ED64; --brand-green-dark: #00684A; --brand-teal-deep: #001E2B;
  --canvas: #FFFFFF; --surface: #F8F9FA; --hairline: #E0E4E8; --hairline-strong: #C5CAD0;
  --ink: #001E2B; --steel: #889397; --on-dark: #FFFFFF;
  --rounded-md: 8px; --rounded-lg: 12px; --rounded-full: 9999px;
  --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --focus-ring: rgba(0,104,74,0.1);
  color-scheme: light;
}
[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #0A1A22;
  --surface: #10232E;
  --hairline: #1D3744;
  --hairline-strong: #2C4C5B;
  --ink: #E7F1F5;
  --steel: #728A96;
  --brand-green-dark: #31D38A;
  --focus-ring: rgba(49,211,138,0.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-family); background: var(--brand-teal-deep); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--ink); }
.login-card { background: var(--canvas); border-radius: var(--rounded-lg); padding: 48px; width: 400px; max-width: 90%; box-shadow: rgba(0,30,43,0.2) 0px 16px 48px -8px; }
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.logo svg { color: var(--brand-green); }
.logo span { font-size: 22px; font-weight: 700; color: var(--ink); }
.login-card h2 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.login-card p { font-size: 14px; color: var(--steel); margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.form-group input { width: 100%; padding: 10px 14px; border: 1px solid var(--hairline-strong); border-radius: var(--rounded-md); font-family: var(--font-family); font-size: 14px; color: var(--ink); background: var(--canvas); }
.form-group input:focus { outline: none; border-color: var(--brand-green-dark); box-shadow: 0 0 0 3px var(--focus-ring); }
.btn { border: none; cursor: pointer; font-family: var(--font-family); font-size: 14px; font-weight: 600; width: 100%; padding: 12px; border-radius: var(--rounded-full); transition: all 150ms ease; }
.btn-primary { background: var(--brand-green); color: #001E2B; }
.btn-primary:hover { background: #00DA5A; }
.btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
.error { color: #DB3030; font-size: 13px; margin-top: 12px; display: none; }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><path d="M8 12h8M12 8v8"/></svg>
    <span>Neopxl AI</span>
  </div>
  <h2>Sign in</h2>
  <p>Enter your credentials to access the dashboard</p>
  <form id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="admin@neopxl.ai" required autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>
    </div>
    <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
    <div class="error" id="error"></div>
  </form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const error = document.getElementById('error');
  btn.disabled = true; btn.textContent = 'Signing in...'; error.style.display = 'none';

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await r.json();
    if (!r.ok) { error.textContent = data.error || 'Login failed'; error.style.display = 'block'; btn.disabled = false; btn.textContent = 'Sign In'; return; }
    localStorage.setItem('neopxl_token', data.token);
    localStorage.setItem('neopxl_user', JSON.stringify(data.user));
    window.location.href = '/';
  } catch (err) {
    error.textContent = 'Connection error';
    error.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
